services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - models:/root/.ollama
volumes:
  models:
